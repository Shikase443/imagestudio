name: image-studio

services:
  image-studio:
    image: image-studio:v1
    build: .
    pull_policy: never
    platform: linux/arm64
    init: true
    user: "${HOST_UID}:${HOST_GID}"
    environment:
      TZ: JST-9
      API_TIMEOUT_SECONDS: "600"
      GEN_ENCODER_FILE: "${GEN_ENCODER_FILE:-Qwen-Image-2.1-Turbo-Abliterated-Uncensored-Q8_0.gguf}"
      VLM_MODEL_FILE: "${VLM_MODEL_FILE:-Qwen-Image-2.1-Turbo-Abliterated-Uncensored-Q8_0.gguf}"
      NVIDIA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "${API_PORT:-8000}:8000"
      - "${WEBUI_PORT:-8080}:8080"
    volumes:
      - ./models:/models:${MODEL_MOUNT_MODE:-ro}
      - ./output:/output
      - ${GEN_MODEL_CHECKS:-./config/model-checks-gen.txt}:/app/config/model-checks-gen.txt:ro
      - ${VLM_MODEL_CHECKS:-./config/model-checks-vlm.txt}:/app/config/model-checks-vlm.txt:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    read_only: true
    tmpfs:
      - /tmp:size=512m
    mem_limit: 76g
    memswap_limit: 76g
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    stop_grace_period: 60s
    restart: unless-stopped
